version: 2.1
jobs:
  build_test:
    docker:
      - image: cimg/node:current
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            npm install
  build_docker_image:
    docker:
      - image: cimg/node:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: false
      - run:
          name: Build Docker Image
          command: |
            docker build -t nodejswebapp1 -t andreizimin/nodejswebapp1:latest .
            echo $DOCKER_PASSWORD | docker login -u andreizimin --password-stdin
            docker push andreizimin/nodejswebapp1:latest
workflows:
  build_test:
    jobs:
      - build_test
      - build_docker_image:
          requires:
            - build_test
